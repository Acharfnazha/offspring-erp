# Local / single-server deployment of OFFSPRING ERP.
#   docker compose up -d --build                 # database + app (migrations run automatically)
#   docker compose --profile seed run --rm seed  # OPTIONAL: load fictional demo data (WIPES the database!)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-offspring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-offspring_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default. Uncomment for local tooling only:
    # ports: ["127.0.0.1:5432:5432"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-offspring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-offspring_erp}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Beirut}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage/uploads

  seed:
    profiles: ["seed"]
    build: { context: ., target: builder }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-offspring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-offspring_erp}?schema=public
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

volumes:
  pgdata:
  uploads:
