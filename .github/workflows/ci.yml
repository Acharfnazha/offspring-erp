name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: offspring
          POSTGRES_PASSWORD: offspring
          POSTGRES_DB: offspring_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U offspring" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://offspring:offspring@localhost:5432/offspring_erp?schema=public
      TEST_DATABASE_URL: postgresql://offspring:offspring@localhost:5432/offspring_erp_test?schema=public
      APP_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=offspring psql -h localhost -U offspring -d offspring_erp -c "CREATE DATABASE offspring_erp_test"
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - run: npm run build
      - name: Seed demo data
        run: npm run db:seed
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (not pushed)
        run: docker build --target runner -t offspring-erp:ci .
